name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os, trueform_cloud; expected = f"v{trueform_cloud.__version__}"; assert os.environ["RELEASE_TAG"] == expected, f"Release tag must be {expected}"'
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_package.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/trueform-cloud/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1